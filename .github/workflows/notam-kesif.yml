# NOTAC yanıt sözleşmesini ÖLÇEN tek seferlik keşif iş akışı.
#
# Neden var: NOTAC'ın web arayüzü NOTAM'ın tam orijinal metnini gösteriyor
# ("B3455/26 NOTAMR B2849/26 ...") ama bizim çektiğimiz `text` alanı
# yalnızca E) gövdesini taşıyor. Ayrıca yürürlüğe girmemiş (upcoming)
# NOTAM'ları hangi sorgu parametresinin getirdiğini bilmiyoruz.
#
# Bu iş akışı yalnızca ELLE çalışır (zamanlanmış değil), hiçbir şey
# yazmaz/commit etmez - sadece okur ve çıktıya basar. API anahtarı
# hiçbir satıra yazılmaz (bkz. ltfj_notam_client modül açıklaması).
name: NOTAM keşif (elle)

on:
  workflow_dispatch:
    inputs:
      location:
        description: "ICAO kodu"
        required: false
        default: "LTFJ"

permissions:
  contents: read

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTAC_API_KEY: ${{ secrets.NOTAC_API_KEY }}
      NOTAM_KESIF_LOCATION: ${{ inputs.location }}
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install --quiet requests

      - name: Kesif
        run: python notam_kesif.py
