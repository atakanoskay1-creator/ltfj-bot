# MGM otomatik istasyonlarini OLCEN kesif is akisi - SALT OKUNUR.
#
# Neden var: Omerli Baraji tarafinda nem/sicaklik olcen bir MGM istasyonu
# olup olmadigini ve anlik verisinin duzenli cekilip cekilemeyecegini
# GitHub Actions'in gercek ag ortamindan gormek (gelistirme ortami MGM'ye
# erisemiyor). Hicbir sey commit etmez (permissions: contents: read); ham
# yanitlar yalnizca gecici dizine yazilir ve artifact olarak yuklenir.
#
# Tetikleyiciler: workflow_dispatch (elle) ve bu iki dosya degisen PR'lar
# (merge ONCESI gercek ciktiyi gormek icin).
name: MGM istasyon keşif (salt okunur)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mgm_istasyon_kesif.py"
      - ".github/workflows/mgm-istasyon-kesif.yml"

permissions:
  contents: read

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install --quiet requests

      - name: Kesif
        run: python mgm_istasyon_kesif.py --ham-dizin "$RUNNER_TEMP/mgm_istasyon"

      - name: Ham yanitlari artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgm-istasyon-kesif-ham
          path: ${{ runner.temp }}/mgm_istasyon
          retention-days: 30
          if-no-files-found: warn
