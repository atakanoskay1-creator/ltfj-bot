name: LTFJ bildirim

on:
  schedule:
    # Turkiye'de METAR her saatin :20 ve :50'sinde yayinlanir (AIP AD 2.11:
    # inis tahmini TREND, yayin araligi 1/2 saat) ve rasat.mgm.gov.tr'ye
    # ortalama 5 dakika icinde duser. Bu yuzden :25 ve :55'te cekiyoruz.
    # :10 ve :40 ise TAF icin - TAF'in sabit yayin saati yok.
    # Dakikalar UTC ama Turkiye UTC+3 oldugu icin dakika degerleri ayni.
    - cron: "10,25,40,55 * * * *"
  # Actions sekmesinden elle calistirmak icin
  workflow_dispatch:
    inputs:
      notam_zorla:
        description: "NOTAM senkronunu zorla (3 saatlik süre kapısını atla)"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [run-ltfj-bot]
# state dosyasini repoya geri yazabilmek icin
permissions:
  contents: write

# Iki calistirma ust uste binmesin
concurrency:
  group: ltfj-bildirim
  cancel-in-progress: false

jobs:
  bildir:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TZ: Europe/Istanbul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTAC_API_KEY: ${{ secrets.NOTAC_API_KEY }}
      # Zamanlanmis kosularda BOS gelir (girdi yok) -> zorlama kapali.
      # Elle calistirirken kutu isaretlenirse "true" dizesi gelir.
      NOTAM_ZORLA_SENKRON: ${{ inputs.notam_zorla }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # firebase-admin (grpc vb.) her kosuda yeniden indiriliyordu.
          # Anahtar requirements.txt'in ozeti; tekerlekler onbellekten gelir.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bagimliliklar
        run: pip install --quiet -r requirements.txt

      # Onbellek AYRI bir workflow'la tazeleniyor ama GitHub zamanlanmis
      # kosulari dusuruyor, bu yuzden onbellek bot calistiginda bayat
      # olabiliyordu ve "Onumuzdeki saatler" seridi kayboluyordu.
      #
      # Bu adim SADECE bayatsa ag'a cikar ve HATASI YUTULUR - Open-Meteo
      # cokerse METAR/TAF akisi etkilenmez. Botun KENDISI hala yalnizca
      # yerel dosyayi okur; gevsek baglilik sozlesmesi (bkz.
      # ltfj_dis_kaynak_cache modul acikamasi) kodda aynen duruyor,
      # burada yalnizca tetikleme firsati artiyor.
      #
      # Sonuc BILEREK commit EDILMIYOR: bu kosuda uretilen sayfa zaten
      # taze tahmini aliyor (asil kazanc bu) ve dosyayi commit etmek iki
      # workflow arasinda yeni bir push yarisi acardi. Tek yazar hala
      # dis-kaynak-onbellek.yml.
      - name: Onbellek bayatsa tazele (hata yutulur)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "bot")   # bot modulleri bot/ altinda
          import ltfj_dis_kaynak_cache as c
          yas = c.tahmin_yasi_dk()
          if yas is not None and yas <= c.TAHMIN_ESIK_DK:
              print(f"önbellek taze ({yas:.0f} dk), tazeleme atlandı.")
              sys.exit(0)
          print(f"önbellek bayat ({'yok' if yas is None else f'{yas:.0f} dk'}), tazeleniyor...")
          subprocess.run([sys.executable, "bot/ltfj_dis_kaynak_cache.py"], check=False)
          PY

      - name: Botu calistir
        run: python bot/ltfj_bot.py

      # Omerli tarafi MGM istasyonlari (bot/ltfj_omerli.py): yalnizca ileriye
      # donuk kayit, bot/model okumaz. Hata yutulur - METAR/TAF akisi ve
      # commit adimi hicbir kosulda etkilenmez.
      - name: Omerli istasyonlarini kaydet (hata yutulur)
        continue-on-error: true
        timeout-minutes: 1
        run: python bot/ltfj_omerli.py

      - name: State ve sayfayi repoya geri yaz
        run: |
          set -u
          DAL="${GITHUB_REF_NAME}"
          DOSYALAR="ltfj_state.json index.html panel_veri.json notam_veri.json gozlem_arsivi.csv gozlem_surumleri.csv gozlem_arsivi_durum.json tahmin_gunlugu.csv tahmin_dogrulama.csv omerli_gozlem.csv"

          # `git add` OLMAYAN bir yol icin "fatal: pathspec did not match"
          # verip (Actions run adimlari `bash -e` ile calisir) TUM adimi
          # dusurur. gozlem_arsivi.csv ilk kosuda henuz yoktur; botun
          # fail-open dali devreye girerse hic olusmayabilir de. Bu yuzden
          # listeyi her seferinde "diskte var YA DA git'te izlenen"
          # yollara indiriyoruz - silinmis izlenen dosya da yakalansin.
          mevcut_dosyalar() {
            local liste="" d
            for d in ${DOSYALAR}; do
              if [ -e "$d" ] || git ls-files --error-unmatch "$d" >/dev/null 2>&1; then
                liste="${liste} $d"
              fi
            done
            echo "${liste}"
          }

          if [ -z "$(mevcut_dosyalar)" ]; then
            echo "Yazilacak dosya yok."
            exit 0
          fi

          if [ -z "$(git status --porcelain $(mevcut_dosyalar))" ]; then
            echo "Degisiklik yok, commit yok."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for deneme in 1 2 3; do
            git add $(mevcut_dosyalar)
            if ! git diff --cached --quiet; then
              git commit -m "durum guncellendi [skip ci]"
            fi

            if git push origin "HEAD:${DAL}"; then
              echo "Push basarili (deneme ${deneme})."
              exit 0
            fi

            echo "Push reddedildi - baska bir calistirma araya girmis."
            echo "Uzaktaki state ile birlestiriliyor (deneme ${deneme})..."

            # Bizim surumu kenara al, uzaktakine hizalan, sonra ikisini birlestir.
            # index.html, panel_veri.json ve notam_veri.json her calistirmada
            # yeniden uretildigi icin birlestirme gerektirmez - bizimki daha
            # yenidir, oldugu gibi geri yazilir.
            cp ltfj_state.json /tmp/bizim_state.json
            mkdir -p /tmp/bizim_arsiv
            for d in gozlem_arsivi.csv gozlem_surumleri.csv gozlem_arsivi_durum.json; do
              cp "$d" /tmp/bizim_arsiv/ 2>/dev/null || true
            done
            cp tahmin_gunlugu.csv /tmp/bizim_tahmin_gunlugu.csv 2>/dev/null || true
            cp omerli_gozlem.csv /tmp/bizim_omerli_gozlem.csv 2>/dev/null || true
            cp index.html /tmp/bizim_index.html 2>/dev/null || true
            cp panel_veri.json /tmp/bizim_panel_veri.json 2>/dev/null || true
            cp notam_veri.json /tmp/bizim_notam_veri.json 2>/dev/null || true
            git fetch origin "${DAL}"
            git reset --hard "origin/${DAL}"
            python bot/state_birlestir.py ltfj_state.json /tmp/bizim_state.json
            # Gozlem arsivi EKLEME-YALNIZCA: reset sonrasi uzaktakiyle
            # bizimkini BIRLESTIR (kanonik + surum), yoksa araya giren
            # kosunun ekledigi gozlemler kaybolur. Kanonik celiski (degismezlik
            # ihlali) gizlenmez: stderr'e uyari + gozlem_arsivi_durum.json'da
            # sayac. Durumun arsiv bolumu birlesik dosyalardan yeniden
            # uretilir; cekim sagligi bu kosununki kalir.
            if [ -f /tmp/bizim_arsiv/gozlem_arsivi.csv ]; then
              python bot/ltfj_gozlem_arsivi.py --birlestir-bizim /tmp/bizim_arsiv \
                --dosya gozlem_arsivi.csv || true
            fi
            # Tahmin gunlugu de EKLEME-YALNIZCA: araya giren kosunun
            # kaydettigi tahmin kaybolmasin; ayni gozlemde ONCE kaydedilen kalir.
            if [ -f /tmp/bizim_tahmin_gunlugu.csv ]; then
              python bot/ltfj_tahmin_gunlugu.py --birlestir-bizim /tmp/bizim_tahmin_gunlugu.csv \
                --dosya tahmin_gunlugu.csv || true
            fi
            # Omerli kaydi da EKLEME-YALNIZCA: ayni dilimde ONCE kaydedilen kalir.
            if [ -f /tmp/bizim_omerli_gozlem.csv ]; then
              python bot/ltfj_omerli.py --birlestir-bizim /tmp/bizim_omerli_gozlem.csv \
                --dosya omerli_gozlem.csv || true
            fi
            # Okuma dosyasi TURETILMIS: birlesik gunluk + birlesik arsivden
            # yeniden uretilir (iki tarafin kopyasi birlestirilmez).
            python bot/ltfj_tahmin_gunlugu.py --dogrulama-yaz --dosya tahmin_gunlugu.csv || true
            cp /tmp/bizim_index.html index.html 2>/dev/null || true
            cp /tmp/bizim_panel_veri.json panel_veri.json 2>/dev/null || true
            cp /tmp/bizim_notam_veri.json notam_veri.json 2>/dev/null || true
          done

          echo "3 denemede de push edilemedi." >&2
          exit 1
